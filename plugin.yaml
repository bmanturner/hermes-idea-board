name: idea-board
version: 0.1.0
description: "Each night I read your chats and what this profile can do, and post a short board of things I can take off your plate, each tied to your own words. Click an idea to start it in a new chat; dismiss one with a reason and I learn."
author: Brendan Turner
license: MIT
homepage: https://github.com/bmanturner/hermes-idea-board
requires_hermes: ">=0.22.0"
provides_tools:
  - idea_board_run
provides_hooks:
  - pre_llm_call
config_schema:
  max_cards: {type: int, default: 6, description: "Most new ideas per run"}
  history_days: {type: int, default: 14, description: "Days of chat history each run reads"}
